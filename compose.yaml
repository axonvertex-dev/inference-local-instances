name: inference-local-instances

services:
  vllm:
    profiles: ["vllm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: inference-vllm
    restart: unless-stopped
    gpus: all
    ipc: host
    ports:
      - "127.0.0.1:${VLLM_PORT:-18181}:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:-google/gemma-4-E2B-it-qat-w4a16-ct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-2}
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}

  litert-lm:
    profiles: ["litert"]
    build:
      context: ./deployments/litert-lm
      dockerfile: Dockerfile.cpu
      args:
        LITERT_LM_VERSION: ${LITERT_LM_VERSION:-0.13.1}
    image: inference-local-litert-lm:${LITERT_LM_VERSION:-0.13.1}
    container_name: inference-litert-lm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITERT_PORT:-18182}:9379"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      LITERT_HF_REPO: ${LITERT_HF_REPO:-litert-community/gemma-4-E2B-it-litert-lm}
      LITERT_MODEL_FILE: ${LITERT_MODEL_FILE:-gemma-4-E2B-it.litertlm}
      LITERT_MODEL_ID: ${LITERT_MODEL_ID:-gemma4-e2b}
      LITERT_CONTAINER_PORT: "9379"
    volumes:
      - litert-registry:/root/.litert-lm
      - hf-cache:/root/.cache/huggingface

  ollama:
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: inference-ollama
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-data:/root/.ollama

volumes:
  hf-cache:
  litert-registry:
  ollama-data:
